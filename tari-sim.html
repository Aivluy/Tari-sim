:root{color-scheme:light;--bg:#F4F6F4;--sf:#fff;--bd:#E2E8F0;--p:#0F766E;--ph:#115E59;--s:#0284C7;--ok:#10B981;--wr:#F59E0B;--er:#EF4444;--m:#3B82F6;--h:#EC4899;--tx:#0f172a;--mu:#64748b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font-family:'Roboto Slab',Georgia,serif;font-size:15px}
#side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#174C3C;color:#fff;padding:16px 10px;overflow:auto;z-index:20;transition:transform .2s}
#side h1{font-size:22px;margin:4px 10px 14px;font-weight:800}#side h1 small{display:block;font-size:11px;font-weight:400;opacity:.75}
#side a{display:flex;gap:10px;align-items:center;padding:9px 12px;color:#d1fae5;text-decoration:none;border-radius:10px;font-size:14px;margin-bottom:2px}
#side a:hover{background:#ffffff1a}#side a.on{background:var(--p);color:#fff;font-weight:600}
#main{margin-left:250px;min-height:100%}
#top{position:sticky;top:0;background:#fffffff0;border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px;z-index:10}
#burger{display:none;font-size:22px;background:none;border:0}
.pill{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;display:inline-block}
.ok{background:var(--ok)}.wr{background:var(--wr)}.er{background:var(--er)}
#view{padding:20px;max-width:1200px}
h2{margin:0 0 4px;font-size:24px}.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0000000d;margin-bottom:16px}
.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi b{display:block;font-size:26px;color:var(--p)}.kpi span{color:var(--mu);font-size:13px}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
button:hover{background:var(--ph)}button.sec{background:#fff;color:var(--p);border:1px solid var(--p)}button.dg{background:var(--er)}button.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;margin:4px 0 10px}
label{font-size:13px;font-weight:600;color:#334155}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
.sc{overflow-x:auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row>*{flex:1;min-width:130px}.row>button{flex:0 0 auto}
.al{border-left:5px solid var(--wr);padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:10px;border:1px solid var(--bd);border-left-width:5px}

</style></head><body class="lock">
<nav id="side"></nav>
<div id="main"><div id="top"><button id="burger" aria-label="Menú">☰</button><b style="flex:1" id="ttl"></b><span id="net" class="pill"></span><span id="usr"></span><button class="sec sm" id="out">Salir</button></div><div id="view"></div></div>
<div id="auth"><div class="ab"><div id="ahero"></div><div class="alogo"><span id="alg"></span><span>Tari<b>-SIM</b></span></div><h1 class="at">Protegemos hoy a las taricayas del mañana</h1><p class="ad">Plataforma para el monitoreo de nidos artificiales y la simulación biológica de la taricaya (<i>Podocnemis unifilis</i>)</p><div id="aform"></div></div></div><div id="toast"></div><div id="modal"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),f=(n,d=1)=>Number(n).toFixed(d),pH=T=>100/(1+Math.exp(-2.2*(T-31.5)));
const hatch=(T,H)=>{let r=90;if(T>33)r-=(T-33)*(T>34.5?45:12);if(T<29)r-=(29-T)*(T<26.5?35:10);if(H<65)r-=(65-H)*.8;if(H>85)r-=(H-85)*1.5;return Math.max(2,Math.min(95,r))};
const dias=T=>Math.round(Math.max(58,Math.min(78,61+(33-T)*3)));
const ymd=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const KEY='tarisim_v1';let S;
function seed(){let s=7;const R=()=>(s=s*16807%2147483647)/2147483647;
const sectors=[{id:'A',name:'Sector A - Zona Alta Soleada',cap:12,sub:'Arena gruesa',base:33},{id:'B',name:'Sector B - Zona Media con Malla Sombra',cap:12,sub:'Arena mixta',base:31.4},{id:'C',name:'Sector C - Zona Baja',cap:10,sub:'Arena fina húmeda',base:29.8}];
const defs=[['A',58,82],['A',38,95],['A',33,70],['B',45,88],['B',40,76],['B',35,91],['C',42,84],['C',31,66],['B',90,80,70,6,4],['C',92,74,61,8,5]];
const nests=defs.map((d,i)=>({id:i+1,code:'NID-'+String(i+1).padStart(3,'0'),sector:d[0],sow:ymd(-d[1]),eggs:d[2],depth:15+Math.round(R()*8),alive:d[3]??null,inf:d[4]??null,dead:d[5]??null}));
const readings=[];nests.slice(0,8).forEach(n=>{const sc=sectors.find(x=>x.id===n.sector),el=Math.min(30,Math.floor(-(new Date(n.sow)-Date.now())/864e5)+1);
for(let k=el-1;k>=0;k--){let t=sc.base+Math.sin(k/4+n.id)*.8+(R()-.5)*.7,h=76+Math.sin(k/3)*7+(R()-.5)*5;
if(n.id===2&&k<3)t=34.2+(2-k)*.2;if(n.id===8&&k<4)h=62-(3-k)*4;
readings.push({n:n.id,t:ymd(-k)+'T08:00',temp:+t.toFixed(1),hum:Math.round(h),depth:n.depth,notes:'',pend:false})}});
return{sectors,nests,readings,res:{},lastSync:new Date().toISOString(),camp:'Campaña 2026',nid:11}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.nests)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const act0=n=>!(n.alive!=null),sec=id=>S.sectors.find(x=>x.id===id)||{name:id,base:31.5};
const rd=n=>S.readings.filter(r=>r.n===n.id).sort((a,b)=>a.t<b.t?-1:1),last=n=>rd(n).slice(-1)[0];
const avg=(a,k)=>a.length?a.reduce((s,x)=>s+x[k],0)/a.length:0;
const avgT=n=>{const r=rd(n);return r.length?avg(r,'temp'):sec(n.sector).base},avgH=n=>{const r=rd(n);return r.length?avg(r,'hum'):75};
const elap=n=>Math.floor((Date.now()-new Date(n.sow))/864e5)+1,tot=n=>dias(avgT(n));
const risk=n=>{const l=last(n);return l&&(l.temp>34||l.temp<26.5||l.hum<55||l.hum>92)};
const badge=n=>risk(n)?'<span class="pill er">Riesgo</span>':'<span class="pill ok">Óptimo</span>';
function alerts(){const A=[];S.nests.filter(act0).forEach(n=>{const l=last(n);if(!l)return;
const add=(ty,pr,msg)=>{const k=n.code+'|'+ty;A.push({k,n,pr,msg,r:S.res[k]})};
if(l.temp>34)add('T','Alta',`${n.code}: temperatura ${l.temp} °C supera 34.0 °C (límite letal sostenido: 34.5 °C)`);
if(l.temp<26.5)add('F','Alta',`${n.code}: temperatura ${l.temp} °C bajo 26.5 °C`);
if(l.hum<55)add('H','Alta',`${n.code}: humedad ${l.hum}% bajo 55% (riesgo de deshidratación)`);
if(l.hum>92)add('W','Media',`${n.code}: humedad ${l.hum}% sobre 92% (hongos/asfixia)`);
if(elap(n)>=55)add('E','Media',`${n.code}: día ${elap(n)}, eclosión inminente (preparar liberación)`)});return A}
/* charts */
function chart(ser,o={}){const W=640,H=o.h||220,L=40,B=26,T=10;const refs=o.refs||[];const all=ser.flatMap(s=>s.d).concat(refs.map(r=>r.y));let lo=o.lo??Math.floor(Math.min(...all)-1),hi=o.hi??Math.ceil(Math.max(...all)+1);
const n=Math.max(...ser.map(s=>s.d.length)),x=i=>L+(n>1?i*(W-L-8)/(n-1):0),y=v=>T+(hi-v)*(H-T-B)/(hi-lo||1);let g='';
for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="4" y="${y(v)+4}" font-size="11" fill="#64748b">${f(v,0)}</text>`}
refs.forEach(r=>g+=`<line x1="${L}" x2="${W}" y1="${y(r.y)}" y2="${y(r.y)}" stroke="${r.c}" stroke-dasharray="5 4"/><text x="${W-4}" y="${y(r.y)-4}" font-size="11" text-anchor="end" fill="${r.c}">${r.l}</text>`);
ser.forEach(s=>g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`);
const lb=o.lab||[];[0,Math.floor(n/2),n-1].forEach(i=>{if(lb[i])g+=`<text x="${x(i)}" y="${H-6}" font-size="11" fill="#64748b" text-anchor="middle">${lb[i]}</text>`});
return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg><div class="tag">${ser.map(s=>`<span style="color:${s.c}">●</span> ${s.name}`).join(' &nbsp; ')}</div>`}
/* pages */
const pages={};let flt={q:'',s:'',st:'',v:'tabla'},th={mode:'nest',id:1},edN=null,edS=null;
pages.dashboard=()=>{const a=S.nests.filter(act0),lr=a.map(last).filter(Boolean),T=avg(lr,'temp'),H=avg(lr,'hum');
const eg=a.reduce((s,n)=>s+n.eggs,0);let sv=0,fh=0;a.forEach(n=>{const h=hatch(avgT(n),avgH(n))/100*n.eggs;sv+=h;fh+=h*pH(avgT(n))/100});
const days7=[...Array(7)].map((_,i)=>ymd(i-6));const ser=k=>days7.map(d=>{const r=S.readings.filter(x=>x.t.startsWith(d));return r.length?avg(r,k):0});
const al=alerts().filter(x=>!x.r).slice(0,5),pf=sv?fh/sv*100:50;
return`<h2>Dashboard General</h2><p class="sub">${S.camp} · resumen de la playa artificial</p>
<div class="grid g5"><div class="card kpi"><b>${a.length}</b><span>Nidos activos</span></div><div class="card kpi"><b>${eg}</b><span>Huevos sembrados</span></div><div class="card kpi"><b>${f(T)} °C</b><span>Temp. promedio actual</span></div><div class="card kpi"><b>${f(H,0)}%</b><span>Humedad promedio</span></div><div class="card kpi"><b>${eg?f(sv/eg*100,0):0}%</b><span>Supervivencia estimada</span></div></div>
<div class="grid g2"><div class="card"><b>Temperatura (7 días)</b>${chart([{name:'Temp °C',c:'#0F766E',d:ser('temp')}],{refs:[{y:31.5,c:'#0284C7',l:'Pivotal 31.5'}],lab:days7.map(d=>d.slice(5))})}</div>
<div class="card"><b>Humedad (7 días)</b>${chart([{name:'Humedad %',c:'#0284C7',d:ser('hum')}],{lo:40,hi:100,refs:[{y:65,c:'#10B981',l:'Óptimo 65'}],lab:days7.map(d=>d.slice(5))})}</div></div>
<div class="grid g2"><div class="card"><b>Alertas recientes</b><div style="margin-top:10px">${al.map(x=>`<div class="al ${x.pr}"><span class="pill ${x.pr=='Alta'?'er':'wr'}">${x.pr}</span> ${x.msg}</div>`).join('')||'<div class="empty">Sin alertas activas</div>'}</div></div>
<div class="card"><b>Proporción sexual proyectada</b><div class="bar" style="margin:12px 0"><div style="width:${100-pf}%;background:var(--m)">♂ ${f(100-pf,0)}%</div><div style="width:${pf}%;background:var(--h)">♀ ${f(pf,0)}%</div></div><p class="tag">Calculada con la función sigmoidea (k = 2.2, pivotal 31.5 °C) sobre la temperatura media de cada nido, ponderada por crías proyectadas.</p></div></div>`};
pages.monitoreo=()=>{let L=S.nests.filter(n=>(!flt.q||n.code.toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.s||n.sector===flt.s)&&(!flt.st||(risk(n)?'Riesgo':'Óptimo')===flt.st));
const rows=L.map(n=>{const l=last(n);return{n,l}});
return`<h2>Monitoreo de Nidadas</h2><p class="sub">Nidos sembrados en la playa artificial</p><div class="card"><div class="row"><input id="fq" placeholder="Buscar código…" value="${flt.q}"><select id="fs"><option value="">Todos los sectores</option>${S.sectors.map(s=>`<option value="${s.id}" ${flt.s==s.id?'selected':''}>${s.name}</option>`).join('')}</select><select id="fst"><option value="">Todos los estados</option><option ${flt.st=='Óptimo'?'selected':''}>Óptimo</option><option ${flt.st=='Riesgo'?'selected':''}>Riesgo</option></select><button class="sec" data-a="view">${flt.v=='tabla'?'Ver tarjetas':'Ver tabla'}</button></div>
${!rows.length?'<div class="empty">Sin resultados</div>':flt.v=='tabla'?`<div class="sc"><table><tr><th>Código</th><th>Sector</th><th>Siembra</th><th>Días</th><th>Huevos</th><th>Temp</th><th>Hum</th><th>Estado</th><th></th></tr>${rows.map(({n,l})=>`<tr><td><b>${n.code}</b></td><td>${n.sector}</td><td>${n.sow}</td><td>${act0(n)?`Día ${elap(n)}/${tot(n)}`:'Finalizado'}</td><td>${n.eggs}</td><td>${l?l.temp:'-'}</td><td>${l?l.hum:'-'}</td><td>${badge(n)}</td><td><button class="sm" data-a="det" data-id="${n.id}">Detalle</button></td></tr>`).join('')}</table></div>`:
`<div class="grid g5">${rows.map(({n,l})=>`<div class="card" style="margin:0"><b>${n.code}</b> ${badge(n)}<div class="tag">Sector ${n.sector} · ${n.eggs} huevos</div><p>${act0(n)?`Día ${elap(n)}/${tot(n)}`:'Finalizado'}<br>🌡 ${l?l.temp:'-'} °C · 💧 ${l?l.hum:'-'}%</p><button class="sm" data-a="det" data-id="${n.id}">Detalle</button></div>`).join('')}</div>`}</div>`};
pages.registro=()=>{const now=new Date(new Date()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
return`<h2>Registro de Campo</h2><p class="sub">Se guarda localmente y se sincroniza cuando haya red</p><div class="card" style="max-width:560px"><form id="rf"><label>Nido</label><select id="rn">${S.nests.filter(act0).map(n=>`<option value="${n.id}">${n.code} · Sector ${n.sector}</option>`).join('')}</select><label>Fecha y hora</label><input type="datetime-local" id="rt" value="${now}" readonly>
<label>Temperatura del sustrato (°C)</label><input id="rte" type="number" step="0.1" inputmode="decimal" required><label>Humedad relativa (%)</label><input id="rh" type="number" step="1" inputmode="numeric" required><label>Profundidad medida (cm)</label><input id="rp" type="number" step="1" inputmode="numeric" required>
<label>Notas (depredadores, lluvia, sombra)</label><textarea id="rno" rows="3"></textarea><div id="rerr" style="color:var(--er);margin-bottom:8px"></div><button style="width:100%;font-size:16px;padding:14px">Guardar registro</button></form></div>`};
function simCalc(){const T=+$('#sT').value,H=+$('#sH').value,Sh=+$('#sS').value,N=+$('#sN').value,Te=T-4*Sh/100,pf=pH(Te),hr=hatch(Te,H),al=Math.round(N*hr/100),d=dias(Te);
$('#vT').textContent=f(T)+' °C';$('#vH').textContent=H+'%';$('#vS').textContent=Sh+'% (Temp. efectiva '+f(Te)+' °C)';$('#vN').textContent=N;
$('#sx').innerHTML=`<div style="width:${100-pf}%;background:var(--m)">♂ ${f(100-pf,0)}%</div><div style="width:${pf}%;background:var(--h)">♀ ${f(pf,0)}%</div>`;
$('#so').innerHTML=`<div class="grid g5"><div class="card kpi"><b>${f(hr,0)}%</b><span>Tasa de eclosión</span></div><div class="card kpi"><b>${al}</b><span>Crías vivas (♂ ${Math.round(al*(100-pf)/100)} / ♀ ${Math.round(al*pf/100)})</span></div><div class="card kpi"><b>${d} d</b><span>Días hasta eclosión</span></div></div>`;
let c,m;const bad=Te>34.5||Te<26.5||H<50||H>92;
if(bad){c='var(--er)';m='Alerta Crítica: '+(Te>34.5?'riesgo de feminización extrema y mortalidad térmica':Te<26.5?'frío letal, mortalidad embrionaria':H<50?'deshidratación de huevos':'hongos y asfixia embrionaria')}
else if(Math.abs(pf-50)<=15&&hr>=80){c='var(--ok)';m='Condición Ideal: balance sexual cercano a 1:1'}
else{c='var(--wr)';m='Precaución: sesgo '+(pf>50?'hacia hembras':'hacia machos')+' o eclosión por debajo del óptimo'}
$('#sd').style.background=c;$('#sd').textContent=m;
const x=t=>40+(t-26)*(590/10),y=p=>200-p*1.9;let path='';for(let t=26;t<=36.01;t+=.25)path+=(path?'L':'M')+x(t)+','+y(pH(t));
$('#sc').innerHTML=`<svg viewBox="0 0 640 230" width="100%"><rect x="${x(28)}" y="10" width="${x(30.5)-x(28)}" height="190" fill="#3B82F622"/><rect x="${x(32.5)}" y="10" width="${x(34)-x(32.5)}" height="190" fill="#EC489922"/>
${[0,50,100].map(p=>`<line x1="40" x2="630" y1="${y(p)}" y2="${y(p)}" stroke="#e2e8f0"/><text x="4" y="${y(p)+4}" font-size="11" fill="#64748b">${p}%</text>`).join('')}
<line x1="${x(31.5)}" x2="${x(31.5)}" y1="10" y2="200" stroke="#0284C7" stroke-dasharray="5 4"/><text x="${x(31.5)+4}" y="22" font-size="11" fill="#0284C7">Pivotal 31.5 °C</text>
<line x1="${x(34.5)}" x2="${x(34.5)}" y1="10" y2="200" stroke="#EF4444" stroke-dasharray="5 4"/><text x="${x(34.5)-4}" y="22" font-size="11" fill="#EF4444" text-anchor="end">Letal 34.5</text>
<path d="${path}" fill="none" stroke="#0F766E" stroke-width="3"/><circle cx="${x(Math.max(26,Math.min(36,Te)))}" cy="${y(pf)}" r="7" fill="#EC4899" stroke="#fff" stroke-width="2"/>
${[26,28,30,32,34,36].map(t=>`<text x="${x(t)}" y="222" font-size="11" fill="#64748b" text-anchor="middle">${t}°</text>`).join('')}</svg><div class="tag">Curva: % de hembras vs temperatura. Zonas sombreadas: machos 28–30.5 °C (azul) y hembras 32.5–34 °C (rosa).</div>`}
pages.simulador=()=>`<h2>Simulador Predictivo TSD</h2><p class="sub">Podocnemis unifilis · P♀(T) = 100 / (1 + e^(−2.2·(T − 31.5)))</p><div class="grid g2"><div class="card"><label>Temperatura promedio de incubación: <b id="vT"></b></label><input type="range" id="sT" min="26" max="36" step="0.1" value="31.5"><label>Humedad del sustrato: <b id="vH"></b></label><input type="range" id="sH" min="30" max="100" value="75"><label>Cobertura de sombra: <b id="vS"></b></label><input type="range" id="sS" min="0" max="100" value="0"><label>Huevos simulados: <b id="vN"></b></label><input type="range" id="sN" min="10" max="300" value="100"></div>
<div class="card"><b>Proporción sexual</b><div class="bar" id="sx" style="margin:10px 0 16px"></div><div id="so"></div><div class="diag" id="sd"></div></div></div><div class="card"><b>Curva TSD</b><div id="sc"></div></div>`;
pages.termico=()=>{const bySec=th.mode=='sec';let ser,lab=[];const cols=['#0F766E','#0284C7','#F59E0B','#EC4899'];
if(bySec){ser=S.sectors.map((s,i)=>{const dd=[...Array(30)].map((_,k)=>{const d=ymd(k-29);const r=S.readings.filter(x=>x.t.startsWith(d)&&S.nests.find(n=>n.id===x.n)?.sector===s.id);return r.length?avg(r,'temp'):null});return{name:s.id,c:cols[i%4],d:dd.map((v,i,a)=>v??a.find(z=>z!=null)??31)}});lab=[...Array(30)].map((_,k)=>ymd(k-29).slice(5))}
else{const n=S.nests.find(x=>x.id==th.id)||S.nests[0],r=rd(n);ser=[{name:n.code,c:'#0F766E',d:r.map(x=>x.temp)}];lab=r.map(x=>x.t.slice(5,10))}

pages.ayuda=()=>{const p=[...Array(41)].map((_,i)=>26+i/4);return`<h2>Ayuda y Guía Biológica</h2><p class="sub">Manual para técnicos y voluntarios</p><div class="grid g2"><div class="card"><b>¿Qué es la TSD?</b><p>En <i>Podocnemis unifilis</i> (taricaya) el sexo se define por la temperatura del nido durante el segundo tercio de incubación (TSD tipo Ia): frío → machos, cálido → hembras. A 31.5 °C la proporción es ~50/50.</p><svg viewBox="0 0 300 100" width="100%"><path d="${p.map((t,i)=>(i?'L':'M')+((t-26)*30)+','+(95-pH(t)*.9)).join('')}" fill="none" stroke="#0F766E" stroke-width="3"/><line x1="165" x2="165" y1="0" y2="100" stroke="#0284C7" stroke-dasharray="4"/></svg></div>

const back='<button type="button" class="alk" data-av="home">← Volver</button>';
$('#aform').innerHTML={home:`<button class="b1" data-av="login">Iniciar sesión</button><button class="b2" data-av="reg">Crear una cuenta</button><button class="b3" data-av="google">${GL}Continuar con Google</button>`,
login:`<form id="af-login"><input name="email" type="email" placeholder="Correo electrónico" autocomplete="email" required><input name="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required><div class="aer"></div><button class="b1">Entrar</button>${back}</form>`,
reg:`<form id="af-reg"><input name="name" placeholder="Nombre completo" autocomplete="name" required><input name="email" type="email" placeholder="Correo electrónico" autocomplete="email" required><input name="pass" type="password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="new-password" required><input name="pass2" type="password" placeholder="Repite la contraseña" autocomplete="new-password" required><div class="aer"></div><button class="b1">Crear cuenta</button>${back}</form>`,
google:`<form id="af-g"><input name="name" placeholder="Tu nombre" required><input name="email" type="email" placeholder="tu.correo@gmail.com" required><div class="aer"></div><button class="b3">${GL}Continuar con Google</button><p class="anote">Demo: el acceso real con Google requiere un ID de cliente OAuth. Aquí la cuenta se guarda solo en este dispositivo.</p>${back}</form>`}[v]}
function enter(u){try{localStorage.setItem(SK,JSON.stringify({name:u.name,email:u.email}))}catch(e){}$('#usr').textContent=u.name.split(' ')[0];document.body.classList.remove('lock');scrollTo(0,0);go()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-av]');if(b)av(b.dataset.av)});
$('#out').onclick=()=>{try{localStorage.removeItem(SK)}catch(e){}document.body.classList.add('lock');av('home')};
document.addEventListener('submit',async e=>{const i=e.target.id;if(!i||i.slice(0,3)!='af-')return;e.preventDefault();const q=n=>e.target.querySelector('[name='+n+']').value.trim(),er=e.target.querySelector('.aer'),em=q('email').toLowerCase(),L=users();
if(i=='af-reg'){if(q('pass').length<6)return er.textContent='La contraseña debe tener al menos 6 caracteres';if(q('pass')!=q('pass2'))return er.textContent='Las contraseñas no coinciden';if(L.some(u=>u.email==em))return er.textContent='Ese correo ya tiene una cuenta';
const salt=Math.random().toString(36).slice(2),u={name:q('name'),email:em,salt,hash:await hp(q('pass'),salt),via:'local'};L.push(u);try{localStorage.setItem(AK,JSON.stringify(L))}catch(x){}enter(u)}
if(i=='af-login'){const u=L.find(x=>x.email==em);if(!u||u.via=='google'&&!u.hash||await hp(q('pass'),u.salt)!=u.hash)return er.textContent='Correo o contraseña incorrectos';enter(u)}
if(i=='af-g'){let u=L.find(x=>x.email==em);if(!u){u={name:q('name'),email:em,via:'google'};L.push(u);try{localStorage.setItem(AK,JSON.stringify(L))}catch(x){}}enter(u)}});
function boot(){av('home');const s=ldj(SK);if(s&&s.email)enter(s)}
boot();
</script></body></html>
